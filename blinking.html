<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>👁️ Blinking Contest</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <!-- Versions are pinned: these four have to agree, and an unpinned "latest"
       silently breaks the page the day any of them ships a major bump.
       face-detection is not optional — the tfjs FaceMesh runtime uses it to
       locate the face before fitting the mesh, and without it estimateFaces
       just returns [] forever with no error. -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.22.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@4.22.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.22.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-detection@1.0.3"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection@1.0.6"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Courier New', monospace;
      background: #000;
      color: #00ff00;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .container { text-align: center; width: 100%; max-width: 900px; }

    h1 {
      font-size: clamp(24px, 5vw, 44px);
      margin-bottom: 6px;
      text-shadow: 0 0 20px #00ff00;
      letter-spacing: 2px;
    }
    .tagline { font-size: 13px; opacity: 0.55; letter-spacing: 3px; margin-bottom: 26px; }

    .loading { font-size: 16px; opacity: 0.8; padding: 40px 0; }

    /* The feed is never shown — only the two eye crops are. It keeps a real
       layout size and is clipped by the wrapper rather than shrunk to 1px,
       because a 1x1/hidden video can stop being composited and then supplies
       no frames to drawImage or the detector. */
    .camhide {
      position: fixed; left: 0; bottom: 0; z-index: -1;
      width: 2px; height: 2px; overflow: hidden; opacity: 0.01; pointer-events: none;
    }
    .camhide video { width: 320px; height: 180px; }

    .stage { display: none; }

    .eyes {
      display: flex; gap: clamp(10px, 3vw, 28px);
      justify-content: center; align-items: center;
      position: relative;
    }

    .eye {
      position: relative;
      flex: 1 1 0; max-width: 380px;
      border: 2px solid #00ff00;
      border-radius: 10px;
      overflow: hidden;
      background: #001100;
      box-shadow: 0 0 24px rgba(0, 255, 0, 0.18) inset, 0 0 18px rgba(0, 255, 0, 0.12);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .eye.closed {
      border-color: #ff3b30;
      box-shadow: 0 0 26px rgba(255, 59, 48, 0.35) inset, 0 0 20px rgba(255, 59, 48, 0.25);
    }
    .eye canvas { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; }

    .eye-tag {
      position: absolute; top: 7px; left: 9px;
      font-size: 11px; letter-spacing: 2px; opacity: 0.75;
      text-shadow: 0 0 6px #000;
    }
    .eye-ear {
      position: absolute; bottom: 7px; right: 9px;
      font-size: 11px; letter-spacing: 1px; opacity: 0.6;
      text-shadow: 0 0 6px #000;
    }

    /* overlay that covers both panels: countdown, verdict, prompts */
    .overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      pointer-events: none; gap: 8px;
    }
    .overlay .big {
      font-size: clamp(60px, 16vw, 150px);
      font-weight: bold; line-height: 1;
      text-shadow: 0 0 30px #00ff00, 0 0 60px #00ff00;
    }
    .overlay .msg {
      font-size: clamp(14px, 2.6vw, 22px);
      letter-spacing: 4px;
      text-shadow: 0 0 14px #00ff00;
      background: rgba(0, 0, 0, 0.62);
      padding: 8px 18px; border-radius: 6px;
    }
    .overlay.danger, .overlay.danger .big { color: #ff3b30; }
    .overlay.danger .big { text-shadow: 0 0 30px #ff3b30, 0 0 60px #ff3b30; }
    .overlay.danger .msg { text-shadow: 0 0 14px #ff3b30; }

    @keyframes pop { from { transform: scale(1.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .pop { animation: pop 0.28s cubic-bezier(0.2, 1.4, 0.4, 1); }

    .readout {
      margin-top: 22px;
      display: flex; justify-content: center; gap: clamp(16px, 5vw, 54px);
      flex-wrap: wrap;
    }
    .stat { min-width: 110px; }
    .stat .label { font-size: 11px; letter-spacing: 2px; opacity: 0.5; }
    .stat .value { font-size: clamp(22px, 4.4vw, 34px); text-shadow: 0 0 14px #00ff00; }

    .status { margin-top: 18px; font-size: 13px; letter-spacing: 2px; opacity: 0.7; min-height: 20px; }

    button {
      margin-top: 22px;
      background: transparent; color: #00ff00;
      border: 2px solid #00ff00; border-radius: 8px;
      padding: 12px 30px;
      font-family: inherit; font-size: 15px; letter-spacing: 3px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button:hover { background: #00ff00; color: #000; box-shadow: 0 0 22px #00ff00; }

    .back-link {
      position: fixed; top: 18px; left: 18px;
      color: #00ff00; text-decoration: none; font-size: 15px; opacity: 0.75;
    }
    .back-link:hover { text-shadow: 0 0 10px #00ff00; opacity: 1; }

    .contact { position: fixed; bottom: 10px; left: 12px; font-size: 11px; opacity: 0.45; color: #999; }
    .contact a { color: #667eea; text-decoration: none; }

    @media (max-width: 560px) {
      .eyes { gap: 8px; }
      .eye-ear { display: none; }
    }
  </style>
</head>
<body>
  <a href="index.html" class="back-link">← Back to Home</a>

  <div class="container">
    <h1>👁️ BLINKING CONTEST</h1>
    <p class="tagline">HOW LONG CAN YOU LAST</p>

    <div class="loading" id="loading">Loading face detection…</div>

    <div class="camhide"><video id="video" autoplay playsinline muted></video></div>

    <div class="stage" id="stage">
      <div class="eyes">
        <div class="eye" id="eyeLeft">
          <canvas id="canvasLeft"></canvas>
          <span class="eye-tag">LEFT</span>
          <span class="eye-ear" id="earLeft">—</span>
        </div>
        <div class="eye" id="eyeRight">
          <canvas id="canvasRight"></canvas>
          <span class="eye-tag">RIGHT</span>
          <span class="eye-ear" id="earRight">—</span>
        </div>
        <div class="overlay" id="overlay"></div>
      </div>

      <div class="readout">
        <div class="stat"><div class="label">TIME</div><div class="value" id="timeVal">0.00</div></div>
        <div class="stat"><div class="label">BEST</div><div class="value" id="bestVal">—</div></div>
        <div class="stat"><div class="label">BLINKS</div><div class="value" id="blinkVal">0</div></div>
      </div>

      <div class="status" id="status"></div>
    </div>

    <button id="startButton" style="display: none;">START</button>
    <button id="againButton" style="display: none;">GO AGAIN</button>
  </div>

  <div class="contact">
    Questions or feedback? <a href="mailto:holla@felixflor.es">holla@felixflor.es</a>
  </div>

  <script>
    const video       = document.getElementById('video');
    const loading     = document.getElementById('loading');
    const stage       = document.getElementById('stage');
    const startButton = document.getElementById('startButton');
    const againButton = document.getElementById('againButton');
    const overlay     = document.getElementById('overlay');
    const statusEl    = document.getElementById('status');
    const timeVal     = document.getElementById('timeVal');
    const bestVal     = document.getElementById('bestVal');
    const blinkVal    = document.getElementById('blinkVal');

    const panels = {
      left:  { wrap: document.getElementById('eyeLeft'),  cv: document.getElementById('canvasLeft'),  ear: document.getElementById('earLeft'),  box: null },
      right: { wrap: document.getElementById('eyeRight'), cv: document.getElementById('canvasRight'), ear: document.getElementById('earRight'), box: null }
    };
    for (const p of Object.values(panels)) p.ctx = p.cv.getContext('2d');

    // FaceMesh eye rings. Which anatomical eye each index set lands on is
    // resolved at runtime by x position rather than trusted here.
    const EYE_A = [33, 160, 158, 133, 153, 144];
    const EYE_B = [362, 385, 387, 263, 373, 380];

    const CROP_ASPECT   = 3 / 2;   // panel shape
    const CROP_PAD      = 2.8;     // how much eye-width of context to include
    const SMOOTH        = 0.35;    // crop box easing per detection frame
    const LOCK_FRAMES   = 14;      // stable detections before we call it locked
    const COUNTDOWN_MS  = 3000;
    const BEST_KEY      = 'blinkingContestBest';

    // Acquisition uses a deliberately permissive floor: eye shape and camera
    // angle push some people's open-eye EAR near 0.15, and gating lock-on at
    // the blink threshold would mean they could never start a round at all.
    const LOCK_MIN_EAR = 0.13;
    // Closure is judged as a fraction of this face's own resting EAR. An
    // absolute threshold misses people whose eyelid mesh never fully collapses
    // and fires early on anyone with narrow eyes.
    const CLOSE_RATIO = 0.72;   // mean of both eyes drops this far -> blink
    const HARD_RATIO  = 0.55;   // one eye this far down counts on its own
    let baseline = 0.30;
    let earThreshold = 0.21;
    let minRatio = 1;

    let model = null;
    let state = 'idle';          // idle | searching | countdown | live | ended
    let stableFrames = 0;
    let calibration = [];
    let countdownEnds = 0;
    let roundStart = 0;
    let lastTime = 0;
    let blinkCount = 0;
    let best = parseFloat(localStorage.getItem(BEST_KEY) || '') || 0;
    let frame = 0;
    let lastShownCount = null;
    let detCount = 0, faceCount = 0, noKp = 0, lastErr = '';

    if (best) bestVal.textContent = best.toFixed(2);

    const work = document.createElement('canvas');
    const workCtx = work.getContext('2d', { willReadFrequently: false });
    function grabFrame() {
      if (!video.videoWidth) return false;
      if (work.width !== video.videoWidth) {
        work.width = video.videoWidth;
        work.height = video.videoHeight;
      }
      workCtx.drawImage(video, 0, 0, work.width, work.height);
      return true;
    }

    const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    const meanX = pts => pts.reduce((s, p) => s + p.x, 0) / pts.length;
    const lerp = (a, b, t) => a + (b - a) * t;

    // Eye Aspect Ratio: vertical opening over horizontal width, so it is
    // invariant to how far away the face is.
    function ear(p) {
      return (dist(p[1], p[5]) + dist(p[2], p[4])) / (2 * dist(p[0], p[3]));
    }

    function boxFor(pts) {
      const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
      const cx = (Math.min(...xs) + Math.max(...xs)) / 2;
      const cy = (Math.min(...ys) + Math.max(...ys)) / 2;
      const w = Math.max(Math.max(...xs) - Math.min(...xs), 12) * CROP_PAD;
      return { x: cx - w / 2, y: cy - w / CROP_ASPECT / 2, w, h: w / CROP_ASPECT };
    }

    function ease(prev, next) {
      if (!prev) return next;
      return {
        x: lerp(prev.x, next.x, SMOOTH), y: lerp(prev.y, next.y, SMOOTH),
        w: lerp(prev.w, next.w, SMOOTH), h: lerp(prev.h, next.h, SMOOTH)
      };
    }

    function drawEye(panel, pts, open) {
      const cv = panel.cv, ctx = panel.ctx;
      const W = cv.width, H = cv.height;
      const b = panel.box;
      ctx.clearRect(0, 0, W, H);
      if (!b) return;

      // Mirror the crop so it reads like a mirror rather than a photo of you.
      ctx.save();
      ctx.translate(W, 0);
      ctx.scale(-1, 1);
      try {
        ctx.drawImage(work, b.x, b.y, b.w, b.h, 0, 0, W, H);
      } catch (e) { /* video not ready for this frame */ }
      ctx.restore();

      // landmark ring, mapped into the mirrored crop
      const px = p => W - ((p.x - b.x) / b.w) * W;
      const py = p => ((p.y - b.y) / b.h) * H;
      ctx.strokeStyle = open ? '#00ff00' : '#ff3b30';
      ctx.lineWidth = 2;
      ctx.beginPath();
      pts.forEach((p, i) => i ? ctx.lineTo(px(p), py(p)) : ctx.moveTo(px(p), py(p)));
      ctx.closePath();
      ctx.stroke();

      panel.wrap.classList.toggle('closed', !open);
    }

    function sizeCanvases() {
      for (const p of Object.values(panels)) {
        const w = Math.max(p.cv.clientWidth, 1);
        p.cv.width = Math.round(w);
        p.cv.height = Math.round(w / CROP_ASPECT);
      }
    }
    window.addEventListener('resize', sizeCanvases);

    function setOverlay(html, danger) {
      overlay.innerHTML = html;
      overlay.classList.toggle('danger', !!danger);
    }

    function toSearching(msg) {
      state = 'searching';
      stableFrames = 0;
      calibration = [];
      lastShownCount = null;
      againButton.style.display = 'none';
      timeVal.textContent = '0.00';
      setOverlay('<div class="msg">' + (msg || 'LOOKING FOR YOUR EYES') + '</div>');
      statusEl.textContent = 'Face the camera and hold still.';
    }

    function beginCountdown() {
      state = 'countdown';
      countdownEnds = performance.now() + COUNTDOWN_MS;
      lastShownCount = null;

      // Calibrate to this face: open-eye EAR varies enough between people and
      // camera angles that a fixed 0.21 misfires. 62% of the resting average
      // sits comfortably between open and closed.
      if (calibration.length) {
        baseline = calibration.reduce((s, v) => s + v, 0) / calibration.length;
        earThreshold = baseline * CLOSE_RATIO;
      }
      minRatio = 1;
      statusEl.textContent = 'Locked on. Open ' + baseline.toFixed(3) +
                             ' · blink under ' + earThreshold.toFixed(3);
    }

    function beginRound() {
      state = 'live';
      roundStart = performance.now();
      setOverlay('');
      statusEl.textContent = "Don't blink.";
    }

    function endRound(reason) {
      const elapsed = (performance.now() - roundStart) / 1000;
      state = 'ended';
      lastTime = elapsed;
      timeVal.textContent = elapsed.toFixed(2);

      if (reason === 'blink') {
        blinkCount++;
        blinkVal.textContent = blinkCount;
        const isBest = elapsed > best;
        if (isBest) {
          best = elapsed;
          localStorage.setItem(BEST_KEY, String(best));
          bestVal.textContent = best.toFixed(2);
        }
        setOverlay(
          '<div class="big pop">BLINK</div><div class="msg">' +
          elapsed.toFixed(2) + 's' + (isBest ? ' — NEW BEST' : '') + '</div>', true);
        statusEl.textContent = (isBest ? 'A new personal best. ' : 'Best so far: ' + best.toFixed(2) + 's. ') +
                               '(dipped to ' + (minRatio * 100).toFixed(0) + '% of open)';
      } else {
        setOverlay('<div class="msg">LOST YOUR EYES</div>', true);
        statusEl.textContent = 'Round abandoned — the camera lost track.';
      }
      againButton.style.display = 'inline-block';
    }

    async function loadModel() {
      try {
        loading.textContent = 'Loading TensorFlow backend…';
        await tf.setBackend('webgl');
        await tf.ready();
        loading.textContent = 'Loading FaceMesh model…';
        model = await faceLandmarksDetection.createDetector(
          faceLandmarksDetection.SupportedModels.MediaPipeFaceMesh,
          { runtime: 'tfjs', refineLandmarks: true }
        );
        loading.textContent = 'Ready.';
        startButton.style.display = 'inline-block';
      } catch (err) {
        loading.textContent = 'Error loading model: ' + err.message;
        console.error('[blink] model load failed', err);
      }
    }

    async function start() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' }
        });
        video.srcObject = stream;
        await new Promise(res => {
          if (video.readyState >= 1) return res();
          let done = false;
          const ok = () => { if (done) return; done = true; video.removeEventListener('loadedmetadata', ok); res(); };
          video.addEventListener('loadedmetadata', ok);
          setTimeout(ok, 5000);   // never hang the UI on a missed event
        });
        try {
          await video.play();
        } catch (e) {
          statusEl.textContent = 'Camera stream would not play: ' + e.message;
          console.error('[blink] play() rejected', e);
        }

        loading.style.display = 'none';
        startButton.style.display = 'none';
        stage.style.display = 'block';
        sizeCanvases();

        grabFrame();
        try { await model.estimateFaces(work); } catch (e) {}

        toSearching();
        requestAnimationFrame(loop);
      } catch (err) {
        loading.textContent = 'Error accessing camera: ' + err.message;
        console.error('[blink] camera failed', err);
      }
    }

    async function loop() {
      frame++;
      // A blink's closed phase can be under 100ms, so during a round we detect
      // as fast as the model allows. Idle states can afford to halve the cost.
      if (state === 'live' || frame % 2 === 0) {
        try {
          await step();
        } catch (err) {
          lastErr = 'ERR ' + err.message;
          console.error('[blink] detect error', err);
        }
      }
      if (state === 'searching' && frame % 20 === 0) statusEl.textContent = diag();
      if (state === 'live') timeVal.textContent = ((performance.now() - roundStart) / 1000).toFixed(2);
      requestAnimationFrame(loop);
    }

    function diag() {
      return 'cam ' + (video.videoWidth || 0) + '×' + (video.videoHeight || 0) +
             ' · rs' + video.readyState + (video.paused ? ' · PAUSED' : '') +
             ' · scans ' + detCount + ' · faces ' + faceCount +
             (noKp ? ' · nokp ' + noKp : '') +
             (lastErr ? ' · ' + lastErr : '');
    }

    async function step() {
      if (video.readyState < 2) {
        if (state === 'searching' && detCount === 0) {
          statusEl.textContent = 'Waiting for camera frames… ' + diag();
        }
        return;
      }
      if (!grabFrame()) return;
      detCount++;
      const faces = await model.estimateFaces(work, { flipHorizontal: false });
      if (faces.length) faceCount++;
      if (state === 'searching' && detCount % 8 === 0) statusEl.textContent = diag();

      if (!faces.length) {
        if (state === 'live') return endRound('lost');
        if (state === 'countdown') return toSearching('LOST YOU — TRY AGAIN');
        if (state === 'searching') { stableFrames = 0; calibration = []; }
        return;
      }

      const kp = faces[0].keypoints;
      const a = EYE_A.map(i => kp[i]);
      const b = EYE_B.map(i => kp[i]);
      if (a.some(p => !p) || b.some(p => !p)) { noKp++; return; }

      // Mirrored view puts the subject's left eye on the viewer's left, so the
      // left panel takes whichever ring sits further right in the raw frame.
      const [ptsL, ptsR] = meanX(a) > meanX(b) ? [a, b] : [b, a];

      const earL = ear(ptsL), earR = ear(ptsR);
      const gate = state === 'searching' ? LOCK_MIN_EAR : baseline * CLOSE_RATIO;
      const openL = earL > gate, openR = earR > gate;

      panels.left.box  = ease(panels.left.box,  boxFor(ptsL));
      panels.right.box = ease(panels.right.box, boxFor(ptsR));
      drawEye(panels.left,  ptsL, openL);
      drawEye(panels.right, ptsR, openR);
      panels.left.ear.textContent  = earL.toFixed(3);
      panels.right.ear.textContent = earR.toFixed(3);

      const bothOpen = openL && openR;
      const meanEar = (earL + earR) / 2;
      const ratio = baseline > 0 ? meanEar / baseline : 1;
      const worst = baseline > 0 ? Math.min(earL, earR) / baseline : 1;

      if (state === 'searching') {
        if (bothOpen) {
          stableFrames++;
          calibration.push((earL + earR) / 2);
          if (calibration.length > 40) calibration.shift();
          const left = Math.max(0, LOCK_FRAMES - stableFrames);
          setOverlay('<div class="msg">' + (left ? 'HOLD STILL…' : 'LOCKED') + '</div>');
          if (stableFrames >= LOCK_FRAMES) beginCountdown();
        } else {
          stableFrames = 0;
        }
        return;
      }

      if (state === 'countdown') {
        const remain = countdownEnds - performance.now();
        if (remain <= 0) return beginRound();
        const n = Math.ceil(remain / 1000);
        if (n !== lastShownCount) {
          lastShownCount = n;
          setOverlay('<div class="big pop">' + n + '</div><div class="msg">GET READY</div>');
        }
        return;
      }

      if (state === 'live') {
        minRatio = Math.min(minRatio, ratio);
        if (ratio < CLOSE_RATIO || worst < HARD_RATIO) return endRound('blink');
        // let the baseline follow slow drift (posture, lighting) but never a blink
        if (ratio > 0.92) baseline = baseline * 0.97 + meanEar * 0.03;
      }
    }

    startButton.addEventListener('click', start);
    againButton.addEventListener('click', () => {
      blinkVal.textContent = blinkCount;
      toSearching();
    });

    loadModel();
  </script>
</body>
</html>
